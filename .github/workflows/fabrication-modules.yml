name: "Fabrication - modules"
# One job per KiCad project under modules/ and carriers/.
# Release a single board by tagging <project>-v<N>, eg xgzp6899-v1 or breakout-v2.
on:
  push:
    paths:
      - 'modules/**'
      - 'carriers/**'
      - 'interface/**'
    tags:
      - '*-v*'
  pull_request:
    paths:
      - 'modules/**'
      - 'carriers/**'
      - 'interface/**'
  workflow_dispatch:

jobs:
  boards:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.find.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: find
        run: |
          boards=$(find modules carriers -name '*.kicad_pro' | sort | jq -R -s -c '
            split("\n")[:-1] | map(split("/") | {dir: (.[:-1] | join("/")), name: (.[-1] | rtrimstr(".kicad_pro"))})')
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            board="${GITHUB_REF_NAME%-v*}"
            boards=$(echo "$boards" | jq -c --arg b "$board" 'map(select(.name == $b))')
          fi
          echo "matrix=$boards" >> "$GITHUB_OUTPUT"
          echo "$boards"

  fabrication:
    needs: boards
    if: needs.boards.outputs.matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        board: ${{ fromJSON(needs.boards.outputs.matrix) }}
    uses: gcormier/kicad-jobs/.github/workflows/kicad-fabrication.yaml@main
    with:
      project_dir: ${{ matrix.board.dir }}
      project_name: ${{ matrix.board.name }}
      release_tag_prefix: ${{ matrix.board.name }}-v
    permissions:
      contents: write
